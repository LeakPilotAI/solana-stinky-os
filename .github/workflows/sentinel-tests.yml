name: Sentinel Tests

on:
  pull_request:
    branches:
      - main

jobs:
  sentinel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio
          python -m pip install -e packages/stinky-core
          python -m pip install -e services/sentinel

      - name: Compile Sentinel and Genesis runtime
        run: |
          python -m compileall -q packages/stinky-core/src
          python -m compileall -q services/sentinel/src
          python -m compileall -q scripts

      - name: Run maintained Sentinel tests
        run: |
          python -m pytest -q services/sentinel/tests \
            --ignore=services/sentinel/tests/test_admission.py \
            --ignore=services/sentinel/tests/test_admission_free.py

      - name: Run maintained Genesis runtime and launcher contracts
        run: |
          python -m pytest -q \
            tests/test_genesis_runtime.py \
            tests/test_launcher_contract.py \
            tests/test_runtime_watchdog_safe_stop.py \
            tests/test_multichain_foundation.py \
            tests/test_evm_rpc_foundation.py \
            tests/test_evm_rpc_consensus.py \
            tests/test_evm_block_log_ingestion.py \
            tests/test_evm_erc20_discovery.py \
            tests/test_evm_dex_discovery.py \
            tests/test_evm_liquidity_evidence.py \
            tests/test_evm_contract_code_evidence.py
