name: Sentinel Tests

on:
  pull_request:
    branches:
      - main

jobs:
  sentinel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio
          python -m pip install -e packages/stinky-core
          python -m pip install -e services/sentinel

      - name: Compile Sentinel
        run: python -m compileall -q services/sentinel/src

      - name: Run Sentinel tests
        run: python -m pytest -q services/sentinel/tests
