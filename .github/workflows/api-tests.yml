name: API Tests

on:
  push:
    branches:
      - ci/investigation-entity-graph
  pull_request:
    branches:
      - main

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stinky_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stinky_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      API_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stinky_api_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio
          python -m pip install -e packages/stinky-core
          python -m pip install -e services/api

      - name: Compile API
        run: python -m compileall -q services/api/src

      - name: Run API tests
        run: python -m pytest -q services/api/tests tests/test_genesis_postgres_backup_contract.py tests/test_paper_recovery_pid_reuse.py tests/test_paper_recovery_drill_contract.py tests/test_paper_recovery_soak_contract.py tests/test_formal_paper_validation_preflight_contract.py

      - name: Install PostgreSQL client for isolated backup certification
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Certify full backup and isolated restore
        env:
          PGPASSWORD: postgres
        run: |
          dropdb --if-exists -h 127.0.0.1 -p 5432 -U postgres genesis_backup_fixture
          createdb -h 127.0.0.1 -p 5432 -U postgres genesis_backup_fixture
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d genesis_backup_fixture -f tests/fixtures/genesis_backup_restore_fixture.sql
          python scripts/genesis_postgres_backup.py certify --mode direct --host 127.0.0.1 --port 5432 --user postgres --database genesis_backup_fixture --output-dir /tmp/genesis-backup-cert
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("/tmp/genesis-backup-cert").glob("*.certification.json"))
          assert len(files) == 1, files
          result = json.loads(files[0].read_text())
          assert result["status"] == "PASS"
          assert result["manifest_match"] is True
          assert result["source_database_modified"] is False
          assert result["restored_over_source"] is False
          assert result["temporary_restore_dropped"] is True
          PY
          dropdb --if-exists -h 127.0.0.1 -p 5432 -U postgres genesis_backup_fixture

      - name: Certify Docker-network sidecar backup transport
        env:
          PGPASSWORD: postgres
        run: |
          rm -rf /tmp/genesis-backup-network-cert
          docker network create genesis-backup-ci
          docker run -d --rm --name genesis-backup-ci-db --network genesis-backup-ci \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=genesis_backup_fixture \
            postgres:16
          ready=0
          for i in $(seq 1 30); do
            if docker run --rm --network genesis-backup-ci -e PGPASSWORD \
              postgres:16 pg_isready -h genesis-backup-ci-db -p 5432 -U postgres -d genesis_backup_fixture; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          docker run --rm -i --network genesis-backup-ci -e PGPASSWORD \
            -v "$PWD/tests/fixtures:/fixtures:ro" \
            postgres:16 psql -h genesis-backup-ci-db -p 5432 -U postgres -d genesis_backup_fixture \
            -X -v ON_ERROR_STOP=1 -f /fixtures/genesis_backup_restore_fixture.sql
          python scripts/genesis_postgres_backup.py certify \
            --mode docker-network \
            --network genesis-backup-ci \
            --db-host genesis-backup-ci-db \
            --port 5432 \
            --user postgres \
            --password postgres \
            --database genesis_backup_fixture \
            --output-dir /tmp/genesis-backup-network-cert
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("/tmp/genesis-backup-network-cert").glob("*.certification.json"))
          assert len(files) == 1, files
          result = json.loads(files[0].read_text())
          assert result["status"] == "PASS"
          assert result["manifest_match"] is True
          assert result["source_database_modified"] is False
          assert result["restored_over_source"] is False
          assert result["temporary_restore_dropped"] is True
          PY
          docker rm -f genesis-backup-ci-db
          docker network rm genesis-backup-ci

      - name: Certify pre-013 legacy runtime schema backup and restore
        env:
          PGPASSWORD: postgres
        run: |
          rm -rf /tmp/genesis-backup-legacy-cert
          dropdb --if-exists -h 127.0.0.1 -p 5432 -U postgres genesis_backup_legacy_fixture
          createdb -h 127.0.0.1 -p 5432 -U postgres genesis_backup_legacy_fixture
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d genesis_backup_legacy_fixture -f tests/fixtures/genesis_backup_restore_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d genesis_backup_legacy_fixture <<'SQL'
          ALTER TABLE paper_runtime_record
            DROP COLUMN policy_version,
            DROP COLUMN policy_sha256,
            DROP COLUMN policy_evidence_backed;
          SQL
          python scripts/genesis_postgres_backup.py certify             --mode direct             --host 127.0.0.1             --port 5432             --user postgres             --database genesis_backup_legacy_fixture             --output-dir /tmp/genesis-backup-legacy-cert
          python - <<'PY'
          import json
          from pathlib import Path
          certs = list(Path("/tmp/genesis-backup-legacy-cert").glob("*.certification.json"))
          manifests = list(Path("/tmp/genesis-backup-legacy-cert").glob("*.source-manifest.json"))
          assert len(certs) == 1, certs
          assert len(manifests) == 1, manifests
          result = json.loads(certs[0].read_text())
          manifest = json.loads(manifests[0].read_text())
          assert result["status"] == "PASS"
          assert result["manifest_match"] is True
          assert result["source_database_modified"] is False
          assert result["restored_over_source"] is False
          assert result["temporary_restore_dropped"] is True
          assert manifest["integrity"]["runtime_policy_identity_schema"] == "legacy_embedded_only"
          PY
          dropdb --if-exists -h 127.0.0.1 -p 5432 -U postgres genesis_backup_legacy_fixture

      - name: Certify discovered container endpoint backup transport
        env:
          PGPASSWORD: postgres
        run: |
          rm -rf /tmp/genesis-backup-discovery-cert
          docker network create genesis-backup-discovery
          docker run -d --rm --name genesis-backup-discovery-db --network genesis-backup-discovery \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=genesis_backup_fixture \
            postgres:16
          ready=0
          for i in $(seq 1 30); do
            if docker run --rm --network genesis-backup-discovery -e PGPASSWORD \
              postgres:16 pg_isready -h genesis-backup-discovery-db -p 5432 -U postgres -d genesis_backup_fixture; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          docker run --rm -i --network genesis-backup-discovery -e PGPASSWORD \
            -v "$PWD/tests/fixtures:/fixtures:ro" \
            postgres:16 psql -h genesis-backup-discovery-db -p 5432 -U postgres -d genesis_backup_fixture \
            -X -v ON_ERROR_STOP=1 -f /fixtures/genesis_backup_restore_fixture.sql
          python scripts/genesis_postgres_backup.py certify \
            --mode docker-network \
            --container genesis-backup-discovery-db \
            --discover-container-endpoint \
            --network intentionally-wrong-network-name \
            --db-host intentionally-wrong-host-name \
            --port 5432 \
            --user postgres \
            --password postgres \
            --database genesis_backup_fixture \
            --output-dir /tmp/genesis-backup-discovery-cert
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("/tmp/genesis-backup-discovery-cert").glob("*.certification.json"))
          assert len(files) == 1, files
          result = json.loads(files[0].read_text())
          assert result["status"] == "PASS"
          assert result["manifest_match"] is True
          assert result["source_database_modified"] is False
          assert result["restored_over_source"] is False
          assert result["temporary_restore_dropped"] is True
          PY
          docker rm -f genesis-backup-discovery-db
          docker network rm genesis-backup-discovery
