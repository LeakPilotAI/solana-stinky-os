name: API Tests

on:
  push:
    branches:
      - ci/investigation-entity-graph
  pull_request:
    branches:
      - main

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stinky_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stinky_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      API_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stinky_api_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio
          python -m pip install -e packages/stinky-core
          python -m pip install -e services/api

      - name: Compile API
        run: python -m compileall -q services/api/src

      - name: Run API tests
        run: python -m pytest -q services/api/tests
