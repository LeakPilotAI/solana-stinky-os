name: Web Build

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-build.yml"

jobs:
  web-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build web
        run: npm run build
