name: Entity Resolver Tests

on:
  push:
    branches:
      - ci/entity-resolver-test-gate
  pull_request:
    branches:
      - main

jobs:
  entity-resolver-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio
          python -m pip install -e packages/stinky-core
          python -m pip install -e services/entity-resolver

      - name: Compile Entity Resolver
        run: python -m compileall -q services/entity-resolver/src

      - name: Run Entity Resolver tests
        run: python -m pytest -q services/entity-resolver/tests
