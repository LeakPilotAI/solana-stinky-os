# Stinky OS – local infrastructure
# Ports chosen to avoid conflict with Atlas (5432 / 6379 / 8000)
# Usage: docker compose up -d

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: stinky-postgres
    environment:
      POSTGRES_USER: stinky
      POSTGRES_PASSWORD: stinky
      POSTGRES_DB: stinky
    ports:
      - "5433:5432"   # host 5433 → container 5432 (Atlas owns 5432)
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/event-log/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stinky -d stinky"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stinky-redis
    ports:
      - "6380:6379"   # host 6380 → container 6379 (Atlas owns 6379)
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: stinky-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"   # MinIO API
      - "9011:9001"   # MinIO console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: stinky-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/stinky;
      exit 0;
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
