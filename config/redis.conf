# Genesis durable Redis. Activation requires verified RDB->AOF conversion first.
# This file is a reviewed template; the runtime copy lives in the owned volume.
dir /data
dbfilename dump.rdb
appendonly yes
appendfilename appendonly.aof
appendfsync always
save ""
maxmemory 384mb
maxmemory-policy allkeys-lru
stop-writes-on-bgsave-error yes
tcp-keepalive 60
