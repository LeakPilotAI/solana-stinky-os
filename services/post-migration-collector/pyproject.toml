[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stinky-post-migration"
version = "0.1.0"
description = "Post-Migration Intelligence Collector – early buyers, continuous wallet tracking, performance aggregates"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "stinky-core",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "httpx>=0.27",
    "redis>=5.0",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
]

[project.scripts]
stinky-collector = "post_migration.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/post_migration"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
