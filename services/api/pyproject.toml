[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stinky-api"
version = "0.1.0"
description = "Stinky OS Intelligence API – read models for the terminal UI"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "stinky-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "orjson>=3.10",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.scripts]
stinky-api = "stinky_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stinky_api"]
