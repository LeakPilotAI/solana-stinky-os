[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stinky-discord"
version = "0.1.0"
description = "Stinky OS Discord bot – high-potential migration alerts + intel commands"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "httpx>=0.27",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
]

[project.scripts]
stinky-discord = "discord_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_bot"]

[tool.hatch.build]
dev-mode-dirs = ["src"]