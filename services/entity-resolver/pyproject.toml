[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stinky-entity-resolver"
version = "0.1.0"
description = "Stinky OS Entity Resolution"
requires-python = ">=3.12"
dependencies = [
    "stinky-core",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "orjson>=3.10",
]

[project.scripts]
stinky-entities = "entity_resolver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/entity_resolver"]
