[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stinky-replay"
version = "0.1.0"
description = "Stinky OS event replay and alert backtest CLI"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "orjson>=3.10",
]

[project.scripts]
stinky-replay = "stinky_replay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stinky_replay"]
