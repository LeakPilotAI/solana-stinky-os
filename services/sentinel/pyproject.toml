[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stinky-sentinel"
version = "0.1.0"
description = "Stinky Sentinel – Solana launch detection and creator identification"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "stinky-core",
    "httpx>=0.27",
    "websockets>=12.0",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "orjson>=3.10",
    "base58>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
stinky-sentinel = "sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
