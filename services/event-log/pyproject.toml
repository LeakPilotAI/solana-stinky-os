[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stinky-event-log"
version = "0.1.0"
description = "Event Log service – immutable event store + Data Quality gate for Stinky OS"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "stinky-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "orjson>=3.10",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "testcontainers>=4.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/event_log"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
